<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VRM 웹캠 트래커</title>
<style>
:root{--ink:#3b2f55;--panel:rgba(255,255,255,.78);--accent:#7c5fd0;--line:rgba(124,95,208,.3)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#e6dcf7;color:var(--ink);font:14px/1.5 Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;left:16px;top:16px;width:244px;padding:14px;display:grid;gap:8px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(10px)}
#ui.off,#ui.off~#v{display:none}
button{font:inherit;color:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}
button:hover{border-color:var(--accent)}
button.p{background:var(--accent);border-color:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
#st{margin:0;font-size:12.5px;min-height:3.2em}
#v{position:fixed;right:16px;bottom:16px;width:176px;border-radius:12px;border:1px solid var(--line);background:#000;transform:scaleX(-1)}
#tg{position:fixed;right:16px;top:16px;z-index:2;background:var(--panel);backdrop-filter:blur(10px)}
@media (max-width:700px){
#ui{top:auto;bottom:12px;left:12px;right:12px;width:auto;grid-template-columns:1fr 1fr;padding:10px;gap:6px}
#ui>p,#ui>.row{grid-column:1/-1}
#v{bottom:auto;top:56px;right:12px;width:104px}
}
</style>
<script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
"@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.2/lib/three-vrm.module.min.js"}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<button id="tg" aria-label="메뉴 열기 또는 닫기">메뉴</button>
<section id="ui" aria-label="트래커 설정">
  <button id="bl" class="p">VRM 불러오기</button>
  <button id="bs">샘플 모델로 테스트</button>
  <button id="bc">카메라 시작</button>
  <button id="bk">정면 기준 맞추기</button>
  <label class="row">거울 모드 <input id="mi" type="checkbox" checked></label>
  <label class="row">표정 프리셋 (웃음·화남·놀람) <input id="ep" type="checkbox" checked></label>
  <div class="row"><span>배경</span><span><input id="bg" type="color" value="#e6dcf7" aria-label="배경색"> <button id="bgr">크로마키</button></span></div>
  <p id="st" role="status">VRM 파일을 이 화면에 끌어다 놓거나 불러오세요. H 키로 메뉴를 숨깁니다.</p>
  <input id="f" type="file" accept=".vrm" hidden>
</section>
<video id="v" playsinline muted hidden></video>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { FaceLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

const $ = id => document.getElementById(id), M = THREE.MathUtils, V = $('v');
const st = t => $('st').textContent = t;
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const SAMPLES = [
  'https://pixiv.github.io/three-vrm/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm',
  'https://cdn.jsdelivr.net/gh/pixiv/three-vrm@release/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm'];

/* 장면 */
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(30, 1, .1, 20);
const sun = new THREE.DirectionalLight(0xffffff, Math.PI); sun.position.set(1, 1, 1).normalize();
const gaze = new THREE.Object3D();
scene.add(sun, new THREE.AmbientLight(0xffffff, .5), gaze);
const resize = () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
addEventListener('resize', () => { resize(); if (vrm) fit(); }); resize();

/* VRM 불러오기 */
const loader = new GLTFLoader(); loader.register(p => new VRMLoaderPlugin(p));
let vrm, hy = 1.4, flip = 1;   // flip: VRM 0.x 모델은 정규화 본의 X·Z 축이 뒤집혀 있음
function fit() { const d = Math.max(1.3, .62 / (.536 * camera.aspect)); camera.position.set(0, hy - .05, d); camera.lookAt(0, hy - .05, 0); }
async function show(url, name) {
  st('불러오는 중… ' + name);
  const v = (await loader.loadAsync(url)).userData.vrm;
  if (!v) throw new Error('VRM 데이터가 없는 파일입니다');
  if (vrm) { scene.remove(vrm.scene); VRMUtils.deepDispose(vrm.scene); }
  VRMUtils.rotateVRM0(v);
  v.scene.traverse(o => o.frustumCulled = false);
  vrm = v; scene.add(v.scene);
  flip = v.meta.metaVersion === '0' ? -1 : 1;
  const h = v.humanoid, arm = -1.25 * flip;                 // T포즈 → 팔 내리기
  h.getNormalizedBoneNode('leftUpperArm').rotation.z = arm;
  h.getNormalizedBoneNode('rightUpperArm').rotation.z = -arm;
  v.scene.updateMatrixWorld(true);
  hy = h.getNormalizedBoneNode('head').getWorldPosition(new THREE.Vector3()).y;
  fit();
  gaze.position.set(0, hy + .08, 1.5); gz.copy(gaze.position);
  if (v.lookAt) v.lookAt.target = gaze;
  st('모델 준비 완료. ‘카메라 시작’을 눌러 주세요.');
}
const fail = e => st('불러오지 못했습니다: ' + e.message);
const pick = f => { if (!f) return; const u = URL.createObjectURL(f); show(u, f.name).catch(fail).finally(() => URL.revokeObjectURL(u)); };
$('bl').onclick = () => $('f').click();
$('f').onchange = e => pick(e.target.files[0]);
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); pick(e.dataTransfer.files[0]); });
$('bs').onclick = async () => {
  for (const u of SAMPLES) { try { await show(u, '샘플 모델'); return; } catch {} }
  st('샘플을 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
};

/* 트래킹 */
let fl, last = -1, seen, cal = { x: 0, y: 0, z: 0 }, cur = { ...cal };
const Q = new THREE.Quaternion(), Q2 = new THREE.Quaternion(), E = new THREE.Euler(0, 0, 0, 'YXZ');
const P = new THREE.Vector3(), S = new THREE.Vector3(), T = new THREE.Vector3(), M4 = new THREE.Matrix4();
const rm = (v, a, b) => M.clamp((v - a) / (b - a), 0, 1);
const tg = {}, hd = { x: 0, y: 0, z: 0 }, gz = new THREE.Vector3(0, 1.5, 1.5);   // 표정 · 머리 · 시선 목표값
let base = {}, blend = {};                                                          // 무표정 기준 · 최신 블렌드셰이프
const RATE = { blinkLeft: 55, blinkRight: 55, aa: 40, oh: 40, ou: 40, ee: 40 };    // 표정별 반응 속도
const rot = (n, k, a) => {
  const o = vrm.humanoid.getNormalizedBoneNode(n);
  if (o) o.quaternion.slerp(Q2.setFromEuler(E.set(hd.x * k, hd.y * k, hd.z * k, 'YXZ')), a);
};

function track(r) {
  blend = {};
  for (const c of r.faceBlendshapes[0].categories) blend[c.categoryName] = c.score;
  const mir = $('mi').checked, m = mir ? -1 : 1, A = mir ? 'Right' : 'Left', B = mir ? 'Left' : 'Right';
  const g = k => Math.max(0, (blend[k] || 0) - (base[k] || 0));   // 무표정 기준을 뺀 값

  // 눈 깜빡임
  tg.blinkLeft = rm(g('eyeBlink' + A), .12, .5);
  tg.blinkRight = rm(g('eyeBlink' + B), .12, .5);

  // 입 모양: 데드존으로 가만히 있을 때의 잡음을 버리고, 모음은 하나가 우세하게 배타 처리
  const jaw = rm(g('jawOpen'), .06, .5), fu = rm(g('mouthFunnel'), .12, .55), pu = rm(g('mouthPucker'), .2, .65);
  const wide = rm((g('mouthStretchLeft') + g('mouthStretchRight')) / 2, .15, .6), round = Math.max(fu, pu);
  const open = Math.min(1, jaw * 2.5);
  tg.aa = jaw * (1 - .6 * round);
  tg.oh = Math.min(1, fu * 1.2) * open;
  tg.ou = Math.max(pu, fu * (1 - open));
  tg.ee = wide * (1 - round);

  // 표정 프리셋: 입을 다문 미소는 relaxed, 입을 벌려 웃을 때만 happy
  const pre = $('ep').checked, sm = rm((g('mouthSmileLeft') + g('mouthSmileRight')) / 2, .2, .65), laugh = sm * rm(jaw, .25, .6);
  tg.happy = pre ? laugh * .8 : 0;
  tg.relaxed = pre ? sm * (1 - laugh) * .5 : 0;
  tg.angry = pre ? rm((g('browDownLeft') + g('browDownRight')) / 2, .45, .85) * .8 : 0;
  tg.surprised = pre ? rm(g('browInnerUp'), .5, .9) * rm(Math.max(g('eyeWideLeft'), g('eyeWideRight')), .3, .7) : 0;

  // 시선 (사용자 기준 왼쪽 = +)
  const lk = (g('eyeLookOutLeft') + g('eyeLookInRight') - g('eyeLookInLeft') - g('eyeLookOutRight')) / 2;
  const up = (g('eyeLookUpLeft') + g('eyeLookUpRight') - g('eyeLookDownLeft') - g('eyeLookDownRight')) / 2;
  gz.set(m * lk * .8, hy + .08 + up * .5, 1.5);

  // 머리 회전: 얼굴 변환 행렬 → 오일러
  const mt = r.facialTransformationMatrixes?.[0];
  if (!mt) return;
  M4.fromArray(mt.data).decompose(P, Q, S);
  E.setFromQuaternion(Q, 'YXZ'); cur = { x: E.x, y: E.y, z: E.z };
  hd.x = (cur.x - cal.x) * flip; hd.y = (cur.y - cal.y) * m; hd.z = (cur.z - cal.z) * m * flip;
}

async function makeTracker() {
  const fs = await FilesetResolver.forVisionTasks(MP + '/wasm');
  return FaceLandmarker.createFromOptions(fs, { baseOptions: { modelAssetPath: MODEL, delegate: 'CPU' }, runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true, outputFacialTransformationMatrixes: true });
}

$('bc').onclick = async () => {
  try {
    st('카메라와 트래킹 모델을 준비하는 중…');
    V.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } }, audio: false });
    await V.play(); V.hidden = false;
    fl = fl || await makeTracker();
    st(vrm ? '트래킹 중. 정면을 보고 무표정으로 정면을 보고 ‘정면 기준 맞추기’를 눌러 주세요.' : '카메라 준비 완료. VRM을 불러오면 움직입니다.');
  } catch (e) { st('카메라를 시작하지 못했습니다: ' + e.message + ' (카메라 권한을 확인하세요)'); }
};
$('bk').onclick = () => {
  cal = { ...cur }; base = {};
  for (const k in blend) if (!k.startsWith('eyeBlink')) base[k] = Math.min(.35, blend[k]);
  st('무표정 정면 상태를 기준으로 저장했습니다.');
};

/* 화면 설정 */
$('tg').onclick = () => $('ui').classList.toggle('off');
$('bg').oninput = e => document.body.style.background = e.target.value;
$('bgr').onclick = () => { $('bg').value = '#00b140'; document.body.style.background = '#00b140'; };
addEventListener('keydown', e => { if (e.key.toLowerCase() === 'h') $('ui').classList.toggle('off'); });

/* 렌더 루프 */
const clock = new THREE.Clock();
(function loop(now) {
  requestAnimationFrame(loop);
  const dt = clock.getDelta();
  if (vrm) {
    if (fl && V.readyState >= 2 && V.currentTime !== last) {
      last = V.currentTime;
      const r = fl.detectForVideo(V, now), ok = !!r.faceBlendshapes?.length;
      if (ok) track(r);
      if (ok !== seen) { seen = ok; st(ok ? '얼굴을 인식했습니다.' : '얼굴이 인식되지 않습니다. 밝은 곳에서 정면을 보세요.'); }
    }
    const k = v => 1 - Math.exp(-dt * v), em = vrm.expressionManager;
    for (const n in tg) em.setValue(n, M.lerp(em.getValue(n) || 0, tg[n], k(RATE[n] || 14)));
    gaze.position.lerp(gz, k(25));
    rot('head', .65, k(24)); rot('neck', .35, k(24)); rot('spine', .12, k(24));
    const ch = vrm.humanoid.getNormalizedBoneNode('chest');
    if (ch) ch.rotation.x = Math.sin(clock.elapsedTime * 1.7) * .015;   // 숨쉬기
    vrm.update(dt);                                                      // 스프링본 · 표정 · 시선 갱신
  }
  renderer.render(scene, camera);
})(performance.now());
</script>
</body>
</html>
